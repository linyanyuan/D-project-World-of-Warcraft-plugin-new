[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-client"
version = "0.1.0"
description = "Protocol-driven Unholy DK auto client"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "PySide6-Fluent-Widgets>=1.6",
  "numpy>=1.26",
  "opencv-python>=4.8",
  "dxcam>=0.0.5",
  "mss>=9.0",
  "pywin32>=306",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["clean_client*"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
